# Pobiera wyłączenia prądu z API Energi i zapisuje te dla Rozgart do projects/mw/data.json.
# API Energi nie wysyła nagłówków CORS, więc strona nie może pytać go bezpośrednio.
name: Monitor Wyłączeń – dane

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      location:
        description: "Miejscowość (tylko do testów; harmonogram zawsze używa Rozgart)"
        required: false
        default: Rozgarty

permissions:
  contents: write

concurrency:
  group: mw-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      API_URL: https://energa-operator.pl/__system/api/document/EXTERNAL_DOCUMENT-305647
      LOCATION_FILTER: ${{ inputs.location || 'Rozgarty' }}
      OUT: projects/mw/data.json
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz i przefiltruj dane
        run: |
          curl -fsS --retry 3 --retry-delay 10 -m 60 "$API_URL" -o /tmp/energa.json
          jq -S --arg loc "$LOCATION_FILTER" '{
            shutdowns: [
              .document.payload.shutdowns[]
              | select(.message | contains($loc))
              | {guid, startDate, endDate, hours, message}
            ] | sort_by(.startDate, .guid)
          }' /tmp/energa.json > "$OUT"

      - name: Zapisz zmiany i powiadom
        env:
          MW_NTFY_TOPIC: ${{ secrets.MW_NTFY_TOPIC }}
          TZ: Europe/Warsaw
        run: |
          if git diff --quiet -- "$OUT" && git ls-files --error-unmatch "$OUT" >/dev/null 2>&1; then
            echo "Brak zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "mw: aktualizacja danych o wyłączeniach ($LOCATION_FILTER)"
          # Oczekujemy, że ten push uruchomi przebudowę GitHub Pages (pages-build-deployment)
          # i dopiero po niej nowy data.json trafi na slafs.net. Sprawdzone 28.10.2026:
          # push tokenem GITHUB_TOKEN przebudowę uruchamia. Jeśli kiedyś przestanie,
          # strona będzie po cichu pokazywać stare dane mimo zielonego workflow.
          git push

          # Powiadomienie na telefon (aplikacja ntfy) przy każdej zmianie danych, z aktualną listą.
          # Temat ntfy działa jak hasło, więc jest w sekrecie MW_NTFY_TOPIC; bez niego pomijamy.
          if [ -n "$MW_NTFY_TOPIC" ]; then
            body=$(jq -r '.shutdowns[].hours[]
              | (.fromDate | fromdateiso8601 | strflocaltime("%d.%m %H:%M")) + "–"
                + (.toDate | fromdateiso8601 | strflocaltime("%H:%M"))' "$OUT")
            curl -fsS --retry 3 -m 30 -o /dev/null \
              --url-query "title=Wyłączenia prądu – $LOCATION_FILTER" \
              --url-query "tags=zap" \
              --url-query "click=https://slafs.net/projects/mw/" \
              -d "${body:-Brak planowanych wyłączeń}" "https://ntfy.sh/$MW_NTFY_TOPIC"
          fi
